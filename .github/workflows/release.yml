name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v0.1.0 or v0.2.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify signed APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and derive APK version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo '::error::Use a version tag such as v0.1.0 or v0.2.0-rc.1'
            exit 1
          fi
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          [[ "$tag_commit" == "$(git rev-parse HEAD)" ]]
          version_code=$((GITHUB_RUN_NUMBER + 1))
          ((version_code <= 2100000000))
          {
            echo "tag=$RELEASE_TAG"
            echo "name=${RELEASE_TAG#v}"
            echo "code=$version_code"
            if [[ "$RELEASE_TAG" == *-* ]]; then echo 'prerelease=true'; else echo 'prerelease=false'; fi
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo '::error::Configure the four ANDROID_* signing secrets documented in README.md'
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/embydog-release.jks"

      - name: Run unit tests and Release lint
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          bash ./gradlew --no-daemon --no-configuration-cache testDebugUnitTest lintRelease

      - name: Build, verify and package ARM64 and universal APKs
        shell: bash
        env:
          EMBYDOG_KEYSTORE_PATH: ${{ runner.temp }}/embydog-release.jks
          EMBYDOG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EMBYDOG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EMBYDOG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for abi in arm64-v8a universal; do
            args=(--no-daemon --no-configuration-cache "-PreleaseVersionName=$VERSION_NAME" "-PreleaseVersionCode=$VERSION_CODE")
            if [[ "$abi" != universal ]]; then args+=("-PtargetAbi=$abi"); fi
            bash ./gradlew "${args[@]}" assembleRelease
            apk=app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            python3 .github/scripts/package_release.py "$apk" "$RELEASE_TAG" "$abi" "$VERSION_CODE" dist
          done
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          python3 .github/scripts/package_release.py --checksums dist

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Delete temporary signing key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/embydog-release.jks"

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release
          path: dist

      - name: Create Release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--repo "$GH_REPO" --verify-tag --title "EmbyDog $RELEASE_TAG" --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease --latest=false); fi
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo '::error::Release already exists. Use a new version tag; published APKs are not overwritten.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"
